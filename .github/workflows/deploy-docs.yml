name: Deploy documentation

on:
  push:
    branches:
      - main
  # Build (strict, no deploy) on every pull request so broken links, anchors and nav entries
  # are caught before they reach the published site.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # Fails the build on any broken internal link or nav issue.
      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force --no-history
