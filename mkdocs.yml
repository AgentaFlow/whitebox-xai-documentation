site_name: WhiteBoxXAI Documentation
site_url: https://docs.whiteboxxai.com
site_description: >-
  User documentation for WhiteBoxXAI — the AI observability, explainability, and
  governance platform. Learn how to monitor your models, explain predictions, detect
  drift, audit for bias, and stay compliant.
site_author: AgentaFlow
copyright: Copyright &copy; 2026 AgentaFlow · WhiteBoxXAI

# Update this to the public documentation repository if it differs.
repo_url: https://github.com/AgentaFlow/whitebox-xai-documentation
repo_name: whitebox-xai-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Published URLs are linked from the WhiteBoxXAI app and must keep working. When a page is
  # removed or replaced, add its old path here instead of letting it 404.
  - redirects:
      redirect_maps:
        mcp.md: integrations/mcp.md
        assets/downloads/python_environment.md: agent-resources/skill-libraries.md
        assets/downloads/node_environment.md: agent-resources/skill-libraries.md
        assets/downloads/docker_compose.md: agent-resources/skill-libraries.md
        learn/case-studies.md: learn/index.md
        learn/certification.md: learn/index.md

# Make `mkdocs build --strict` fail on broken internal links and anchors, including
# absolute (/path/) links, which MkDocs otherwise only reports at info level.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AgentaFlow/whitebox-python-sdk
      name: WhiteBoxXAI Python SDK
    - icon: fontawesome/solid/globe
      link: https://whiteboxxai.com
      name: whiteboxxai.com

